name: Deploy to Dreamhost

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      # vendor/ is deliberately NOT built here and NOT shipped - it used to be,
      # but transferring a large, thousands-of-files vendor/ tree kept getting
      # its connection killed on this shared hosting account (broken pipe,
      # 0 bytes received - looks like a resource/process limit on Dreamhost's
      # side for long-lived non-interactive transfers). Composer runs on the
      # server itself instead, further down, where PHP/Composer is natively
      # supported. Node never runs on the server - it's not reliably available
      # on Dreamhost shared hosting, so only its small compiled output
      # (public/build/) gets shipped, never node_modules/.
      - name: Package application code
        run: |
          tar czf /tmp/deploy-app.tar.gz \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=tests \
            --exclude=.github \
            --exclude=public \
            --exclude=.env \
            .
          tar czf /tmp/deploy-public.tar.gz -C public .
          ls -lh /tmp/deploy-app.tar.gz /tmp/deploy-public.tar.gz

      - name: Upload archives
        timeout-minutes: 10
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: /tmp/deploy-app.tar.gz,/tmp/deploy-public.tar.gz
          target: ~/

      # .env lives only on the server and is never touched by this workflow -
      # it isn't part of either archive, and extracting on top of an existing
      # directory doesn't delete files the archive doesn't contain.
      - name: Extract archives, install Composer deps, run post-deploy commands
        timeout-minutes: 15
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            mkdir -p ~/selbuildi-app ~/selbuildi.com
            tar xzf ~/deploy-app.tar.gz -C ~/selbuildi-app
            tar xzf ~/deploy-public.tar.gz -C ~/selbuildi.com
            rm -f ~/deploy-app.tar.gz ~/deploy-public.tar.gz
            cd ~/selbuildi-app

            php -v

            if ! command -v composer >/dev/null 2>&1; then
              if [ ! -f ~/composer.phar ]; then
                php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
                php composer-setup.php --install-dir="$HOME" --filename=composer.phar
                rm -f composer-setup.php
              fi
              COMPOSER_BIN="php $HOME/composer.phar"
            else
              COMPOSER_BIN="composer"
            fi

            export COMPOSER_MEMORY_LIMIT=-1
            $COMPOSER_BIN install --no-dev --optimize-autoloader --no-interaction --prefer-dist

            php artisan storage:link || true
            php artisan migrate --force || echo "migrate failed - .env probably not set up yet"
            php artisan config:cache || echo "config:cache failed - .env probably not set up yet"
            php artisan route:cache || true
            php artisan view:cache || true
