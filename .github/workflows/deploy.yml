name: Deploy to Dreamhost

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      # vendor/ is deliberately NOT built here and NOT shipped - it used to be,
      # but transferring a large, thousands-of-files vendor/ tree kept getting
      # its connection killed on this shared hosting account (broken pipe,
      # 0 bytes received - looks like a resource/process limit on Dreamhost's
      # side for long-lived non-interactive transfers). Composer runs on the
      # server itself instead. Node never runs on the server either - it's
      # not reliably available on Dreamhost shared hosting, so only its small
      # compiled output (public/build/) gets shipped, never node_modules/.
      - name: Package application code
        run: |
          tar czf /tmp/deploy-app.tar.gz \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=tests \
            --exclude=.github \
            --exclude=public \
            --exclude=.env \
            .
          tar czf /tmp/deploy-public.tar.gz -C public .
          ls -lh /tmp/deploy-app.tar.gz /tmp/deploy-public.tar.gz

      # Plain OpenSSH throughout - already proven to work reliably against
      # this account (both interactively and from this same runner). Three
      # different third-party marketplace actions each had their own quirks
      # here (a plain-FTP action against an SFTP-only account, an rsync
      # action whose connection got killed on a large transfer, and an
      # scp action that misdetected this Linux server as Windows) - cutting
      # out the abstraction entirely removes all three failure modes at once.
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload archives
        timeout-minutes: 10
        run: |
          scp -i ~/.ssh/deploy_key /tmp/deploy-app.tar.gz /tmp/deploy-public.tar.gz \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:~/"

      - name: Extract archives, install Composer deps, run post-deploy commands
        timeout-minutes: 15
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            'bash -s' < .github/deploy/remote-setup.sh
